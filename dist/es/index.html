<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d"><meta name="description" content="A un día luz de la Tierra. Recorré el viaje de la Voyager 1 con datos de NASA/JPL en una escena 3D interactiva.">
<title>Voyager — Un día luz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307090d'/%3E%3Cpath d='M16 17l16 32 16-32M23 17l9 19 9-19' fill='none' stroke='%23d7b888' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css?v=4">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<main id="experience">
<div id="scene" aria-label="Voyager 1 en 3D"></div><div class="vignette" aria-hidden="true"></div>
<div id="voyager-locator" aria-hidden="true" hidden><span class="voyager-reticle"></span><span class="voyager-dot"></span></div>
<span id="earth-endpoint" class="distance-endpoint" hidden>Tierra</span><span id="voyager-endpoint" class="distance-endpoint" hidden>Voyager 1</span>
<h2 id="planet-title" aria-live="polite" hidden></h2>
<section class="telemetry" aria-label="Fecha y distancia a la Tierra"><time id="date">05 sept 1977</time><div class="distance"><span class="approx" aria-label="aproximadamente">≈</span> <span id="distance">—</span><span class="unit"> km de la Tierra</span></div></section>
<section id="journey-end" aria-hidden="true" aria-live="polite"><h1><span id="journey-title">1 día luz</span><span id="end-distance"></span></h1><a class="end-credits" href="./es/credits.html" target="_blank" rel="noopener">ESO/S. Brunier · NASA/JPL-Caltech · Solar System Scope</a></section>
<button id="photo-card" hidden aria-haspopup="dialog"><span id="photo-card-image"></span><span class="photo-card-caption"><time id="photo-card-date"></time><span id="photo-card-credit">NASA/JPL ↗</span></span></button>
<dialog id="photo-gallery" aria-labelledby="photo-title">
<button id="photo-close" aria-label="Cerrar fotografías">×</button>
<div id="photo-full"></div>
<div class="photo-meta"><div><h2 id="photo-title"></h2><time id="photo-date"></time><a id="photo-source" target="_blank" rel="noopener">NASA/JPL ↗</a></div><div class="photo-nav"><button id="photo-prev" aria-label="Fotografía anterior">‹</button><span id="photo-count"></span><button id="photo-next" aria-label="Fotografía siguiente">›</button></div></div>
<div id="photo-groups" aria-label="Colecciones de fotografías"></div>
<p id="photo-note" hidden></p>
<div id="photo-strip" aria-label="Todas las fotografías de la Voyager"></div>
</dialog>
<button id="resume" hidden aria-label="Continuar el viaje"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l9 6-9 6z"/></svg><span>Continuar</span></button>
<footer class="transport">
<button id="play" aria-label="Pausar el viaje" title="Pausa"><svg id="play-icon" viewBox="0 0 20 20"><path d="M5 4h3v12H5zM12 4h3v12h-3z"/></svg></button>
<div class="speed-control" id="speed-control"><button id="speed" aria-label="Velocidad de reproducción: 1×" aria-haspopup="menu" aria-expanded="false" aria-controls="speed-menu" title="Velocidad">1×</button><div id="speed-menu" role="menu" aria-label="Velocidad de reproducción" hidden><button role="menuitemradio" aria-checked="false" data-speed="0.25">0.25×</button><button role="menuitemradio" aria-checked="false" data-speed="0.5">0.5×</button><button role="menuitemradio" aria-checked="true" data-speed="1">1×</button><button role="menuitemradio" aria-checked="false" data-speed="2">2×</button><button role="menuitemradio" aria-checked="false" data-speed="4">4×</button></div></div>
<div class="timeline-wrap" id="timeline-wrap"><time id="timeline-date" aria-hidden="true">05 sept 1977</time><span id="timeline-cursor" aria-hidden="true"></span><div class="timeline-track"><div id="progress"></div></div><input id="timeline" type="range" min="0" max="1000" value="0" step="0.1" aria-label="Fecha del viaje"><div id="milestones"></div><div id="photo-markers"></div></div>
<button id="photos-open" aria-label="Ver fotografías de la Voyager" title="Fotografías" aria-haspopup="dialog"><svg viewBox="0 0 20 20"><rect x="2" y="4" width="16" height="12" rx="2"/><circle cx="7" cy="8" r="1.2"/><path d="m3 14 5-4 3 2 3-4 4 5"/></svg></button>
</footer>
<div id="loading" aria-label="Cargando escena"><div class="loading-line"><div id="loading-progress"></div></div></div>
<div id="error" hidden><p id="error-detail"></p><button onclick="location.reload()">Reintentar</button></div>

</main><script type="module" src="./app.js?v=4"></script>
</body></html>
